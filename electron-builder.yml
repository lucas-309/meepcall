appId: ai.meepcall.meepcall
productName: meepcall
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - node_modules/@recallai/**
  # NLLB inference runs in a forked Node child process and needs to require
  # @huggingface/transformers + onnxruntime-node from disk paths, not via the
  # asar archive (the worker is a plain .mjs file outside the bundler).
  - node_modules/@huggingface/**
  - node_modules/onnxruntime-node/**
  - node_modules/onnxruntime-common/**
extraResources:
  - from: build/bin/audio-helper
    to: bin/audio-helper
  - from: build/bin/whisper-cli
    to: bin/whisper-cli
  - from: build/bin/whisper-server
    to: bin/whisper-server
  - from: build/models/ggml-large-v3-turbo.bin
    to: models/ggml-large-v3-turbo.bin
  - from: build/models/silero-vad.onnx
    to: models/silero-vad.onnx
  - from: scripts/nllb-worker.mjs
    to: scripts/nllb-worker.mjs
mac:
  target:
    - dmg
  category: public.app-category.productivity
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  extendInfo:
    NSCameraUsageDescription: meepcall needs camera access to record participant video.
    NSMicrophoneUsageDescription: meepcall needs microphone access to record meeting audio.
    NSScreenCaptureUsageDescription: meepcall needs screen recording access to capture meetings.
    NSAccessibilityUsageDescription: meepcall uses accessibility access to detect meetings.
    NSUserNotificationAlertStyle: alert
dmg:
  artifactName: ${name}-${version}.${ext}
afterPack: build/afterPack.js
npmRebuild: false
